packages:
  - landing
  - docs
  - playground

allowBuilds:
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - mlform@0.2.0

overrides:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0

# The alias reports the Vite+ version; it bundles compatible Vite 8.3.4.
peerDependencyRules:
  allowedVersions:
    vite: '1.3.0'
