name: CI & Publish

on:
  push:
    branches: [main, docs, develop, config, application, domain]
  pull_request:
    branches: [main, develop, 'release/*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python 3.14 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run python landing/scripts/examples.py --check
      - run: uv run pytest --cov=mlschema --cov-report=xml --cov-fail-under=80
      - run: uv build --no-sources
      - name: Check PyPI description
        if: runner.os == 'Linux'
        run: uv tool run --from twine twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  sites:
    name: Build ${{ matrix.site }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        site: [landing, docs, playground]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check landing formatting
        if: matrix.site == 'landing'
        run: pnpm exec vp run mlschema-landing#check:format
      - name: Check playground types and runtime
        if: matrix.site == 'playground'
        run: |
          pnpm exec vp run mlschema-playground#typecheck
          pnpm exec vp run mlschema-playground#test:unit
          pnpm exec vp run mlschema-playground#test:runtime
      - name: Check playground in Chromium
        if: matrix.site == 'playground'
        run: |
          pnpm --dir playground exec playwright install --with-deps chromium
          pnpm exec vp run mlschema-playground#test:e2e
      - run: pnpm exec vp run --filter './${{ matrix.site }}' build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.site }}-build
          path: ${{ matrix.site }}/dist/
          if-no-files-found: error

  publish:
    name: Publish new version to PyPI
    needs: [python, sites]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'UlloaSP/mlschema'
    runs-on: ubuntu-latest
    concurrency:
      group: mlschema-pypi
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
          python-version: '3.14'
      - name: Read version and check PyPI
        id: version
        shell: bash
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "value=$version" >> "$GITHUB_OUTPUT"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://pypi.org/pypi/mlschema/$version/json")
          case "$status" in
            200) echo 'exists=true' >> "$GITHUB_OUTPUT" ;;
            404) echo 'exists=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "PyPI version lookup failed: HTTP $status" >&2; exit 1 ;;
          esac
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.exists == 'false'
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.version.outputs.exists == 'false'
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.exists == 'false'
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: MLschema ${{ steps.version.outputs.value }}
          generate_release_notes: true
          body: 'Release notes: https://docs.mlschema.eshkra.dev/changelog/'
          files: |
            dist/*.whl
            dist/*.tar.gz

  deploy-sites:
    name: Deploy ${{ matrix.site }}
    needs: [python, sites]
    if: github.ref == 'refs/heads/main' && github.repository == 'UlloaSP/mlschema' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: landing
            url: https://mlschema.eshkra.dev
          - site: docs
            url: https://docs.mlschema.eshkra.dev
          - site: playground
            url: https://playground.mlschema.eshkra.dev
    environment:
      name: ${{ matrix.site }}
      url: ${{ matrix.url }}
    concurrency:
      group: ${{ matrix.site }}-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.site }}-build
          path: ${{ matrix.site }}/dist/
      - name: Deploy verified static files
        run: pnpm dlx wrangler@4.151.1 deploy --config ${{ matrix.site }}/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
